<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Agencia FyD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh;">
    <div style="background:#1e293b; padding:40px; border-radius:12px; width:350px;">
        <h2 style="text-align:center; margin-bottom:20px; color:#38bdf8;">🔐 PANEL ADMIN</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <p style="color:#ef4444; font-size:0.85rem; margin-bottom:10px;">{{ messages[0] }}</p>
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div style="margin-bottom:15px;">
                <label style="display:block; font-size:0.85rem; color:#94a3b8;">Usuario</label>
                <input type="text" name="username" style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; color:white; border-radius:6px;" required>
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; font-size:0.85rem; color:#94a3b8;">Contraseña</label>
                <input type="password" name="password" style="width:100%; padding:10px; background:#0f172a; border:1px solid #334155; color:white; border-radius:6px;" required>
            </div>
            <button type="submit" style="width:100%; padding:12px; background:#0284c7; border:none; color:white; font-weight:bold; border-radius:6px; cursor:pointer;">INGRESAR</button>
        </form>
    </div>
</body>
</html>
